[package]
name = "finflowrl"
version = "0.1.0"
edition = "2021"
authors = ["FinFlowRL Team"]
license = "MIT"
description = "Flow-Matching Reinforcement Learning for High-Frequency Trading — Rust port of the configuration subsystem (the full implementation lives in Python under src/finflowrl/)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
